# Barrera de licencia FF++: falla si un notebook (incluidos los que sube Kaggle) trae caras o el log de descarga.
name: licencia-ffpp
on:
  push:
  pull_request:
jobs:
  notebooks-sin-caras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar salidas de notebooks
        run: python tools/limpiar_caras.py --check
